[project]
name = "matchcast-agents"
version = "0.1.0"
description = "MatchCast agent workflow: Producer, Analyst, Narrator and Verifier, with rules implementations"
requires-python = ">=3.12,<3.13"
dependencies = ["azure-core>=1.30,<2", "httpx>=0.27,<1", "matchcast-contracts", "matchcast-metrics", "opentelemetry-api>=1.27,<2", "pydantic>=2.9,<3"]

[tool.uv.sources]
matchcast-contracts = { workspace = true }
matchcast-metrics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matchcast_agents"]
