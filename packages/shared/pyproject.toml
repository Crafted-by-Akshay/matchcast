[project]
name = "matchcast-shared"
version = "0.1.0"
description = "Shared Azure client factories and telemetry for MatchCast services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-data-tables>=12.5,<13",
    "aiohttp>=3.10,<4",
    "azure-eventhub>=5.12,<6",
    "azure-eventhub-checkpointstoreblob-aio>=1.1,<2",
    "azure-identity>=1.19,<2",
    "azure-monitor-opentelemetry>=1.6,<2",
    "azure-storage-blob>=12.23,<13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matchcast_shared"]
