[project]
name = "matchcast-recap"
version = "0.1.0"
description = "fn-recap: Event Hubs trigger that asks the api for the full-time recap (AGT-15)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-identity>=1.19,<2",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matchcast_recap"]
