[project]
name = "matchcast-worker"
version = "0.1.0"
description = "Local-only MatchCast worker bootstrap"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
matchcast-worker = "matchcast_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matchcast_worker"]
