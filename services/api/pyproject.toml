[project]
name = "matchcast-api"
version = "0.1.0"
description = "Initial MatchCast API service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-identity>=1.19,<2",
    "fastapi>=0.120,<0.130",
    "matchcast-agents",
    "matchcast-mcp",
    "matchcast-contracts",
    "matchcast-shared",
    "openai>=1.60,<3",
    "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
matchcast-agents = { workspace = true }
matchcast-mcp = { workspace = true }
matchcast-contracts = { workspace = true }
matchcast-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
