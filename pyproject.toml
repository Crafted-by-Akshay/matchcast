[project]
name = "matchcast-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "services/worker", "services/mcp", "packages/contracts", "packages/agents", "packages/shared", "packages/metrics"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "opentelemetry-sdk>=1.27,<2",
    "pyarrow>=17",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]
smoke = [
    "azure-ai-projects>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/agents/tests", "packages/shared/tests", "packages/metrics/tests", "services/mcp/tests", "services/worker/tests"]
python_files = ["test_*.py"]
pythonpath = ["services/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
