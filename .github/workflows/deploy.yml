name: deploy

# Deploys main to Azure after ci passes (PLT-7). Azure access is OIDC only; the repo holds
# no Azure secret. Images go to GHCR (ADR-0008) and Bicep points the Container Apps at them.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/crafted-by-akshay

jobs:
  deploy:
    # Skipped until the OIDC repo variables exist (docs/infra.md, one-time setup).
    # workflow_run from a fork PR can carry a branch named main, so only same-repo pushes qualify.
    if: >-
      vars.AZURE_CLIENT_ID != '' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    # The OIDC federated credential is bound to this environment, not to a branch ref.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'dev' }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      # Settings azd keeps per environment; a CI run starts from a fresh azd env, so they are repo variables
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      SEARCH_KEYS_IN_VAULT: ${{ vars.SEARCH_KEYS_IN_VAULT || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image tag
        id: tag
        run: echo "sha=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push api
        run: |
          docker build -f services/api/Dockerfile -t "$REGISTRY/matchcast-api:${{ steps.tag.outputs.sha }}" -t "$REGISTRY/matchcast-api:latest" .
          docker push --all-tags "$REGISTRY/matchcast-api"

      - name: Build and push web
        run: |
          API_FQDN=$(az containerapp show -g rg-matchcast -n "ca-api-matchcast-${AZURE_ENV_NAME}" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)
          API_URL=""
          if [ -n "$API_FQDN" ]; then API_URL="https://$API_FQDN"; else echo "::warning::api FQDN not found (first deploy?); web is built without API_URL and needs a second run"; fi
          docker build --build-arg API_URL="$API_URL" -t "$REGISTRY/matchcast-web:${{ steps.tag.outputs.sha }}" -t "$REGISTRY/matchcast-web:latest" apps/unified
          docker push --all-tags "$REGISTRY/matchcast-web"

      - name: Build and push mcp
        run: |
          if [ -f services/mcp/Dockerfile ]; then
            docker build -f services/mcp/Dockerfile -t "$REGISTRY/matchcast-mcp:${{ steps.tag.outputs.sha }}" -t "$REGISTRY/matchcast-mcp:latest" .
            docker push --all-tags "$REGISTRY/matchcast-mcp"
            echo "MCP_IMAGE=$REGISTRY/matchcast-mcp:${{ steps.tag.outputs.sha }}" >> "$GITHUB_ENV"
          else
            echo "::notice::services/mcp/Dockerfile not present yet; mcp keeps its current image"
          fi

      - uses: Azure/setup-azd@v2

      - name: Check GHCR packages are public
        run: |
          # Container Apps pull without a registry secret (ADR-0008), so private packages would fail provision.
          for n in api web; do
            T=$(curl -fsS "https://ghcr.io/token?scope=repository:crafted-by-akshay/matchcast-$n:pull" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
            if curl -fsSI -H "Authorization: Bearer $T" -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json" "https://ghcr.io/v2/crafted-by-akshay/matchcast-$n/manifests/latest" >/dev/null; then
              echo "$n image public"
            else
              echo "::warning::ghcr.io/crafted-by-akshay/matchcast-$n is not public yet; provisioning with the placeholder image. Make the package public and re-run."
              echo "SKIP_${n^^}_IMAGE=1" >> "$GITHUB_ENV"
            fi
          done

      - name: Provision with the new images
        run: |
          azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt
          azd env set AZURE_RESOURCE_GROUP rg-matchcast
          azd env set FOUNDRY_PROJECT_ENDPOINT "$FOUNDRY_PROJECT_ENDPOINT"
          azd env set ENTRA_CLIENT_ID "$ENTRA_CLIENT_ID"
          azd env set ALERT_EMAIL "$ALERT_EMAIL"
          azd env set SEARCH_KEYS_IN_VAULT "$SEARCH_KEYS_IN_VAULT"
          if [ -z "${SKIP_API_IMAGE:-}" ]; then azd env set API_IMAGE "$REGISTRY/matchcast-api:${{ steps.tag.outputs.sha }}"; fi
          if [ -z "${SKIP_WEB_IMAGE:-}" ]; then azd env set WEB_IMAGE "$REGISTRY/matchcast-web:${{ steps.tag.outputs.sha }}"; fi
          if [ -n "${MCP_IMAGE:-}" ]; then azd env set MCP_IMAGE "$MCP_IMAGE"; fi
          azd provision --no-prompt

      - name: Deploy the recap function code
        # fn-recap is a Functions app, not a container: its code goes up with `azd deploy recap`.
        # It must not block the container deploy, so a failure is a warning and the smoke test still runs.
        run: azd deploy recap --no-prompt || echo "::warning::azd deploy recap failed; the recap function runs its previous code"

      - name: Smoke test
        run: |
          API_URI=$(azd env get-value API_URI)
          curl -fsS --retry 12 --retry-delay 15 --retry-all-errors "$API_URI/ready"
