name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.33.0
        ports:
          - 10000:10000
          - 10002:10002
    env:
      MATCHCAST_MODE: local
      MATCHCAST_AGENT_MODE: rules
      MATCHCAST_STORE: memory
      AZURITE_TABLE_URL: http://127.0.0.1:10002/devstoreaccount1
      AZURITE_BLOB_URL: http://127.0.0.1:10000/devstoreaccount1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: make install
      - name: Check that make e2e exists
        id: target
        run: |
          if make -n e2e >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::make e2e not defined yet (QUA-1); job passes until it lands"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Playwright Chromium
        if: steps.target.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite
        if: steps.target.outputs.present == 'true'
        env:
          MATCHCAST_MODE: local
          MATCHCAST_AGENT_MODE: rules
          MATCHCAST_STORE: memory
        run: make e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep with warnings as failures
        run: |
          if [ ! -f infra/main.bicep ]; then echo "::notice::infra/main.bicep not present yet (PLT-3)"; exit 0; fi
          az bicep install
          out=$(az bicep build --file infra/main.bicep --stdout 2>&1 >/dev/null) || { echo "$out"; exit 1; }
          echo "$out"
          if echo "$out" | grep -qi "warning"; then echo "::error::Bicep produced warnings"; exit 1; fi

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Compare served schema with docs/api/openapi.json
        run: |
          if [ ! -f docs/api/openapi.json ]; then echo "::notice::docs/api/openapi.json not committed yet (AGT lane); job passes until it lands"; exit 0; fi
          uv sync --locked --all-packages
          PYTHONPATH=services/api uv run --locked --all-packages python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=2, sort_keys=True))" > "$RUNNER_TEMP/served.json"
          python3 -c "import json,sys; print(json.dumps(json.load(open('docs/api/openapi.json')), indent=2, sort_keys=True))" > "$RUNNER_TEMP/committed.json"
          diff -u "$RUNNER_TEMP/committed.json" "$RUNNER_TEMP/served.json"
