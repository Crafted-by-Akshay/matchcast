server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # The Dockerfile pre-compresses the large files (gzip_static); gzip covers the rest.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  # Files are not content-hashed, so the browser revalidates (ETag) instead of guessing a lifetime.
  expires -1;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;  # the shell frames its own views

  location / {
    try_files $uri $uri/ =404;
  }
}
