<meta charset="utf-8">
<title>MatchCast Enterprise</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23137a4a'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: an analysis-department console. Dark top bar, grouped left nav, one scrolling work area, Copilot drawer on the right. */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#EDF2EF; --surface-3:#E3EAE6; --ink:#13201A; --ink-2:#2E3D36; --muted:#5A6B63; --line:#D9E1DC; --line-2:#C6D1CB;
  --accent:#0C7A53; --accent-ink:#FFFFFF; --accent-soft:#DDF0E6; --focus:#2563EB;
  --top:#0E1814; --top-ink:#E7EFEA; --top-muted:#9DB1A7; --top-line:#22322B;
  --good:#17804F; --good-soft:#DCF1E5; --warn:#A8650F; --warn-soft:#FBEBD2; --bad:#B93B12; --bad-soft:#FBE1D6; --info:#2458C6; --info-soft:#DEE7FA;
  --pitch:#E4F0E7; --pitch-line:#A9C4B1; --grid:#E2E8E4;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(16,32,24,.06),0 4px 14px rgba(16,32,24,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#131C19; --surface-2:#18231F; --surface-3:#1F2B27; --ink:#E3ECE7; --ink-2:#C2CFC8; --muted:#93A59C; --line:#24312C; --line-2:#2F3E38;
  --accent:#3BBE88; --accent-ink:#06140E; --accent-soft:#163428; --focus:#7AA7FF;
  --top:#08100D; --top-ink:#E7EFEA; --top-muted:#8CA197; --top-line:#1B2823;
  --good:#4CC98B; --good-soft:#143224; --warn:#E3A84B; --warn-soft:#33270F; --bad:#F07A52; --bad-soft:#3A1C12; --info:#7AA7FF; --info-soft:#17243F;
  --pitch:#14281D; --pitch-line:#2F5A41; --grid:#1F2B27; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#131C19; --surface-2:#18231F; --surface-3:#1F2B27; --ink:#E3ECE7; --ink-2:#C2CFC8; --muted:#93A59C; --line:#24312C; --line-2:#2F3E38;
  --accent:#3BBE88; --accent-ink:#06140E; --accent-soft:#163428; --focus:#7AA7FF;
  --top:#08100D; --top-ink:#E7EFEA; --top-muted:#8CA197; --top-line:#1B2823;
  --good:#4CC98B; --good-soft:#143224; --warn:#E3A84B; --warn-soft:#33270F; --bad:#F07A52; --bad-soft:#3A1C12; --info:#7AA7FF; --info-soft:#17243F;
  --pitch:#14281D; --pitch-line:#2F5A41; --grid:#1F2B27; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--top)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);height:100%}
#top{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:var(--top);color:var(--top-ink);border-bottom:1px solid var(--top-line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));min-width:0}
#menu{display:none;background:none;border:0;color:var(--top-ink);font-size:20px;width:36px;height:36px;border-radius:6px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font:700 21px/1 var(--f-disp);letter-spacing:.06em}
.brand b span{color:#4FD39B}
.brand em{font:600 11px var(--f-mono);font-style:normal;letter-spacing:.12em;color:var(--top-muted);text-transform:uppercase}
.tenant{display:flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--top-line);border-radius:6px;font-size:12.5px;color:var(--top-ink);white-space:nowrap;min-width:0}
.tenant i{width:9px;height:9px;border-radius:2px;flex:none}
.tenant small{color:var(--top-muted)}
#search{flex:1;max-width:380px;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid var(--top-line);border-radius:6px;padding:0 10px;height:34px}
#search input{flex:1;min-width:0;background:none;border:0;color:var(--top-ink);outline:none}
#search input::placeholder{color:var(--top-muted)}
#search kbd{font:500 11px var(--f-mono);color:var(--top-muted);border:1px solid var(--top-line);border-radius:4px;padding:0 5px}
.top-sp{flex:1}
.envtag{font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#F2C46B;border:1px solid rgba(242,196,107,.4);border-radius:4px;padding:3px 6px;white-space:nowrap}
a.watch{color:var(--top-ink);text-decoration:none;font-size:13px;border:1px solid var(--top-line);border-radius:6px;height:34px;display:flex;align-items:center;padding:0 10px;white-space:nowrap}
a.watch:hover{background:rgba(255,255,255,.07)}
#copbtn{display:flex;align-items:center;gap:6px;background:#4FD39B;color:#06140E;border:0;border-radius:6px;height:34px;padding:0 12px;font-weight:600;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-mono);background:#2C4A3D;color:#E7EFEA;flex:none}
.who select{background:var(--top);color:var(--top-ink);border:1px solid var(--top-line);border-radius:6px;height:32px;padding:0 6px;max-width:190px}
#nav{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px 20px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.ng{font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.ng:first-child{padding-top:4px}
.ni{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;color:var(--ink-2);font-size:13.5px}
.ni:hover{background:var(--surface-2)}
.ni[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.ni[aria-current="page"] svg{color:var(--accent)}
.ni svg{width:17px;height:17px;flex:none;color:var(--muted)}
.ni .cnt{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted)}
.ni .cnt.hot{color:var(--bad)}
.ni .lockic{margin-left:auto;font-size:11px;opacity:.6}
#main{overflow-y:auto;overflow-x:hidden;min-width:0;position:relative}
#scrim{display:none}

/* ---------- page furniture ---------- */
.pg{padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
@media (min-width:900px){.pg{padding-left:28px;padding-right:28px}}
.crumb{font:500 12px var(--f-mono);color:var(--muted);margin-bottom:4px;display:flex;gap:6px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--accent);font:inherit}
.pg-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:16px}
.pg-h h1{font:700 30px/1.05 var(--f-disp);letter-spacing:.02em;margin:0;text-wrap:balance}
.pg-h p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
@media (max-width:1100px){.s8,.s7,.s6,.s5{grid-column:span 12}.s4,.s3{grid-column:span 6}}
@media (max-width:640px){.s4,.s3{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h3{margin:0;font:600 14.5px/1.3 var(--f-body)}
.card-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.card-h .acts{flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .k{font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:700 30px/1.1 var(--f-disp);letter-spacing:.01em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font:500 13px var(--f-body);color:var(--muted);margin-left:4px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.good .v{color:var(--good)}.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-body);padding:4px 8px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;min-height:34px;padding:0 12px;font-weight:500;font-size:13px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{min-height:28px;padding:0 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .lk{font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;border-left:1px solid var(--line-2);padding:0 11px;min-height:32px;font-size:12.5px;color:var(--ink-2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field select,.field input,.field textarea,.inp{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;min-height:34px;padding:0 9px;color:var(--ink);font-size:13px;min-width:0;max-width:100%}
.field textarea{padding:8px 9px;min-height:70px;resize:vertical}
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin-bottom:14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tw{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 9px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th[data-k]{cursor:pointer}
.tbl th[aria-sort="descending"]::after{content:" ▾"}.tbl th[aria-sort="ascending"]::after{content:" ▴"}
.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl td.wrap{white-space:normal;min-width:180px}
.tbl .sub{color:var(--muted);font-size:11.5px}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}
.note{font-size:12px;color:var(--muted)}
.note b{color:var(--ink-2)}
.lock{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 12px;font-size:13px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:600;font-size:13.5px}
.li .s{font-size:12px;color:var(--muted)}
.li>div{min-width:0}
.sp{flex:1}
svg text{font-family:var(--f-mono)}
.ax{font-size:10px;fill:var(--muted)}
.gl{stroke:var(--grid);stroke-width:1}
.pitch-bg{fill:var(--pitch)}.pitch-ln{fill:none;stroke:var(--pitch-line);stroke-width:.35}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chartwrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--top);color:var(--top-ink);border-radius:6px;padding:6px 9px;font-size:12px;z-index:5;white-space:nowrap;box-shadow:var(--shadow)}
.tip b{font-family:var(--f-mono)}
pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:12px/1.5 var(--f-mono);overflow-x:auto;margin:0;color:var(--ink-2);white-space:pre}
.prov{display:inline-flex;gap:6px;align-items:center;font:500 11px var(--f-mono);color:var(--muted)}

/* ---------- copilot drawer ---------- */
#cop{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.12);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cop-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cop-h h2{margin:0;font:700 20px var(--f-disp);letter-spacing:.04em}
.cop-agents{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line)}
#cop-log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.msg{font-size:13.5px;line-height:1.5}
.msg.q{align-self:flex-end;background:var(--accent-soft);border-radius:10px 10px 2px 10px;padding:8px 11px;max-width:85%}
.msg.a{white-space:pre-wrap}
.msg .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.steps{font:12px/1.5 var(--f-mono);color:var(--muted);border-left:2px solid var(--line-2);padding-left:9px;margin-bottom:6px}
.steps div::before{content:"→ ";color:var(--accent)}
#cop-f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
#cop-q{flex:1;min-width:0}
.cop-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.cop-chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink-2)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--top);color:var(--top-ink);padding:10px 16px;border-radius:8px;font-size:13px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:60;font:600 13px var(--f-mono);color:var(--muted);letter-spacing:.1em}
.modal-bg{position:fixed;inset:0;background:rgba(8,16,12,.45);z-index:45;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:10px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 6px;font:700 22px var(--f-disp)}

@media (max-width:1180px){.tenant small,.envtag{display:none}}
@media (max-width:700px){a.watch{display:none}}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  #menu{display:block}
  #nav{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:0;bottom:0;width:260px;z-index:35;transform:translateX(-100%);transition:transform .2s;box-shadow:10px 0 30px rgba(0,0,0,.15)}
  body.nav-open #nav{transform:none}
  body.nav-open #scrim{display:block;position:fixed;inset:0;z-index:34;background:rgba(8,16,12,.35)}
  #search,.tenant{display:none}
  .brand em{display:none}
}
@media (max-width:560px){.who .nm{display:none}.who select{max-width:96px}.who .av{display:none}.tenant{display:none}#copbtn span{display:none}.pg-h h1{font-size:26px}}
@media (prefers-reduced-motion:reduce){#nav{transition:none}}
</style>
<div id="load">LOADING SEASON DATA…</div>
<div id="app">
  <header id="top">
    <button id="menu" aria-label="Open navigation" aria-expanded="false">☰</button>
    <div class="brand"><b>MATCH<span>CAST</span></b><em>Enterprise</em></div>
    <div class="tenant" title="Organisation"><i style="background:#2F7BEA"></i><span id="tenant-n">Harbor City FC</span><small>· Analysis</small></div>
    <label id="search"><span aria-hidden="true">⌕</span><input id="q" placeholder="Search matches, players, clubs" autocomplete="off" aria-label="Search"><kbd>/</kbd></label>
    <span class="top-sp"></span>
    <span class="envtag" title="All data in this tenant is synthetic">Demo tenant · synthetic</span>
    <a class="watch" href="https://claude.ai/artifact/SSjrndFyoFUViaVZ6TzyFX" target="_blank" rel="noopener" title="Open the MatchCast Watch broadcast app">Watch ↗</a>
    <button id="copbtn" aria-expanded="false" aria-controls="cop">✦ <span>Copilot</span></button>
    <div class="who"><div class="av" id="who-av">PR</div><select id="role" aria-label="Signed in as (demo role switcher)"></select></div>
  </header>
  <nav id="nav" aria-label="Main"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="scrim"></div>
<aside id="cop" hidden aria-label="Copilot">
  <div class="cop-h"><h2>✦ COPILOT</h2><span class="chip acc" id="cop-mode">Rules</span><span class="sp"></span><button class="btn sm ghost" id="cop-x" aria-label="Close Copilot">✕</button></div>
  <div class="cop-agents" id="cop-agents"></div>
  <div id="cop-log" aria-live="polite"></div>
  <div class="cop-chips" id="cop-chips"></div>
  <form id="cop-f"><input id="cop-q" class="inp" placeholder="Ask about the season, a club or a player" autocomplete="off" aria-label="Ask Copilot"><button class="btn pri" type="submit">Ask</button></form>
</aside>
<div id="toast" hidden role="status"></div>
