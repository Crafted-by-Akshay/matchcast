# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: matchcast
infra:
  provider: bicep
  path: infra
  module: main
services:
  web:
    project: ./apps/unified
    host: containerapp
    language: js
    docker:
      path: ./Dockerfile
  api:
    project: ./services/api
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
  mcp:
    project: ./services/mcp
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
