# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: matchcast
infra:
  provider: bicep
  path: infra
  module: main
hooks:
  postprovision:
    shell: sh
    run: scripts/set_search_secrets.sh
    continueOnError: true
    interactive: false
services:
  web:
    project: ./apps/unified
    host: containerapp
    language: js
    docker:
      path: ./Dockerfile
  api:
    project: ./services/api
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      context: ../..
  mcp:
    project: ./services/mcp
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
  recap:
    project: ./services/recap
    host: function
    language: python
